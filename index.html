<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#E9E3DA">
<title>Gastos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light only;
    --paper:#E9E3DA; --surface:#FAF7F2; --ink:#3A322A; --muted:#8D8175; --faint:#B5AB9D;
    --line:#E9E0D3; --moca:#7D6958; --moca-d:#5F4F41; --oro:#B98A45;
    --teja:#C0703F; --salvia:#5F7F68; --efeoro:#A5813F;
    --gasto:#B5714F; --gasto-soft:#F2E4D9;
    --ingreso:#5E8A6B; --ingreso-soft:#E6EDE4;
    --danger:#B4472F;
    --shadow:0 1px 2px rgba(58,50,42,.05),0 10px 30px rgba(58,50,42,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#E9E3DA}
  html,body{background:#E9E3DA;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;forced-color-adjust:none}
  body{max-width:560px;margin:0 auto;padding:18px 16px 24px;min-height:100vh;position:relative}
  body::before{content:'';position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;
    background:#E9E3DA;
    background-image:radial-gradient(560px 460px at -12% 22%,rgba(206,192,174,.45),transparent 70%),
                     radial-gradient(620px 560px at 112% 72%,rgba(211,200,185,.5),transparent 70%),
                     radial-gradient(480px 420px at 60% -8%,rgba(216,207,194,.4),transparent 70%)}
  .num{font-variant-numeric:tabular-nums}

  /* Cabecera */
  .app-head{display:flex;align-items:flex-start;justify-content:space-between}
  .hh-title{font-size:23px;font-weight:700;letter-spacing:-.01em}
  .hh-sub{font-size:13px;color:var(--muted);margin-top:3px}
  .gold-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--oro);color:#FFF9EE;font-size:24px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);line-height:1}
  .hero-num{font-size:44px;font-weight:300;letter-spacing:-.02em;margin-top:12px}
  .hero-cap{font-size:13px;color:var(--muted);margin-top:2px}

  /* Accesos rápidos */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .q{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
  .q .ic{width:52px;height:52px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--moca);font-weight:600}
  .q .lb{font-size:12px;font-weight:600;color:var(--muted)}

  /* Puntos de identidad */
  .dt{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
  .dt-ing{background:var(--teja)} .dt-uni{background:var(--salvia)} .dt-efe{background:var(--oro)}

  /* Paneles */
  .paneles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .panel{background:var(--surface);border-radius:26px;padding:15px 16px 7px;box-shadow:var(--shadow)}
  .panel.span2{grid-column:1/-1}
  .p-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center}
  .p-big{font-size:26px;font-weight:300;letter-spacing:-.01em;margin-top:6px}
  .p-cap{font-size:11.5px;color:var(--faint);margin:2px 0 7px}
  .p-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}
  .p-row b{font-weight:600;color:var(--ink);white-space:nowrap}
  .pos{color:var(--ingreso)!important}
  .neg{color:var(--gasto)!important}
  .gasto{color:var(--gasto)!important}
  .verde{color:var(--ingreso)!important}

  /* Selector de mes */
  .pn-ctrl{display:flex;align-items:center;gap:4px}
  .mes-lbl{font-size:12px;font-weight:600;min-width:80px;text-align:center;text-transform:capitalize;color:var(--ink)}
  .pn-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--moca);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--shadow)}

  /* Pendiente: tarjeta moca */
  .pend-block{background:rgba(95,79,65,.96);border-radius:26px;padding:13px 18px 4px;margin-top:12px;box-shadow:var(--shadow)}
  .pend-head{display:flex;align-items:center;gap:8px;padding-bottom:10px}
  .pend-head .pn-title{font-size:15px;font-weight:700;color:#F6F1E8;white-space:nowrap}
  .pend-tot{font-size:16px;font-weight:600;color:#EFC7A9;white-space:nowrap}
  .pend-head .pn-ctrl{margin-left:auto}
  .pend-head .mes-lbl{color:#E8DECF;min-width:60px;font-size:11.5px}
  .pend-head .pn-btn{box-shadow:none;width:26px;height:26px;font-size:14px}
  .pend-row{display:grid;grid-template-columns:106px 1fr auto;align-items:center;column-gap:10px;padding:9px 0;border-top:1px solid rgba(246,241,232,.16);font-size:13px;font-weight:600;color:#EFE5D6;cursor:pointer}
  .pend-row .pc-cnt{color:#BFB09C;font-weight:500;font-size:12px}
  .pend-row b{font-size:16px;text-align:right;color:#EFC7A9}
  .bk{display:flex;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.05em}

  .futuro-line{margin-top:10px;font-size:12.5px;color:var(--efeoro);background:#EFE6D2;border-radius:16px;padding:10px 14px}
  .saldos-line{text-align:center;margin-top:8px}
  .tot-edit{border:0;background:none;color:var(--faint);font-family:inherit;font-size:12px;cursor:pointer;padding:6px 0 0;text-decoration:underline;text-underline-offset:2px}
  .tot-edit:hover{color:var(--ink)}
  .tot-note{font-size:12px;color:var(--muted);background:#F2EDE3;border-radius:12px;padding:9px 11px;margin-top:8px}

  /* Pestañas */
  .tabs{display:flex;gap:6px;background:#DFD8CC;border-radius:28px;padding:5px;margin-top:22px}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:10px;border-radius:23px;cursor:pointer;transition:.15s}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}

  /* Cabeceras de sección */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
  .sec-head h2{font-size:16px;font-weight:600}
  .sec-head .cnt{font-size:13px;color:var(--faint)}
  .sh-l{display:flex;align-items:baseline;gap:8px}
  .ex-head{background:var(--surface);border-radius:24px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);margin:20px 0 8px}
  .ex-head h2{font-size:15px;font-weight:600}
  .ex-head .pn-btn{background:#EFE8DD;box-shadow:none;width:32px;height:32px}

  /* Listas */
  .list{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--surface);border-radius:22px;padding:14px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
  .item .body{flex:1;min-width:0}
  .item .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#EFE8DB;color:#8D8175}
  .chip.ex{background:#F0E7D6;color:var(--efeoro)}
  .chip.in{background:var(--ingreso-soft);color:var(--ingreso)}
  .chip.bk-ing{background:#F3E2D3;color:var(--teja)}
  .chip.bk-uni{background:#E4EBE2;color:var(--salvia)}
  .freq{font-size:11px;color:var(--faint)}
  .amt{text-align:right;font-weight:600;font-size:15px;white-space:nowrap}
  .amt small{display:block;font-size:11px;color:var(--faint);font-weight:500;margin-top:2px}
  .row-actions{display:flex;gap:2px}
  .icon-btn{border:0;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:#F0EAE0;color:var(--ink)}
  .icon-btn.del:hover{color:var(--danger)}
  .icon-btn.confirm{background:var(--danger);color:#fff;font-size:11px;font-weight:700;width:auto;padding:0 8px}
  .icon-btn.confirm:hover{background:var(--danger);color:#fff}
  .form-err{background:#F6E3DB;color:var(--danger);font-size:13px;font-weight:600;border-radius:12px;padding:9px 11px;margin-bottom:11px}
  textarea{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:#F4EFE7;border:1px solid var(--line);border-radius:14px;padding:11px 12px;outline:none;resize:vertical}

  /* Vacíos */
  .empty{background:var(--surface);border:1px dashed #D8CFC0;border-radius:22px;padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{color:var(--ink);display:block;margin-bottom:4px;font-weight:600}

  /* Botones de añadir */
  .add{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--moca);font-family:inherit;font-weight:600;font-size:14px;padding:13px;border-radius:26px;cursor:pointer;margin-top:8px;box-shadow:var(--shadow);transition:.15s}
  .add.ex{color:var(--teja)}
  .add.in{color:var(--salvia)}
  .add:hover{background:#F4EFE7}
  .prev{font-size:12.5px;color:var(--muted);background:var(--ingreso-soft);border-radius:14px;padding:9px 11px;margin-top:2px}
  .prev b{color:var(--ink);font-weight:600}

  /* Formularios */
  .form{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-top:8px}
  .form h3{font-size:14px;font-weight:600;margin-bottom:12px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#F4EFE7;border:1px solid var(--line);border-radius:14px;padding:11px 12px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--moca);background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-actions{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;font-family:inherit;font-weight:600;font-size:14px;padding:12px;border-radius:22px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .btn.primary{background:var(--moca-d);color:#F6F1E8;border-color:var(--moca-d)}


  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* Ventanas emergentes (hoja inferior) */
  .modal-bg{position:fixed;inset:0;z-index:50;background:rgba(58,50,42,.45);display:flex;align-items:flex-end;justify-content:center}
  .modal-bg.hidden{display:none}
  .modal{background:var(--paper);width:100%;max-width:560px;height:86vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:0 16px 28px;box-shadow:0 -8px 40px rgba(58,50,42,.22);animation:sheet .26s cubic-bezier(.22,1,.36,1)}
  @keyframes sheet{from{transform:translateY(40px)}to{transform:translateY(0)}}
  .modal-grip{width:42px;height:5px;border-radius:3px;background:#D6CDBE;margin:10px auto 0}
  .modal-head{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:12px 2px 12px;z-index:3}
  .modal-head h2{font-size:19px;font-weight:600}
  .modal-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;box-shadow:var(--shadow);flex:0 0 auto}
  .modal .form{box-shadow:none;background:var(--surface);margin-top:6px}
  .modal .add{margin-top:12px}
  .m-sub{font-size:13px;color:var(--muted);margin:-4px 2px 12px}

  /* Detalle de pendiente */
  .pd-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
  .pd-row:first-child{border-top:0}
  .pd-day{width:46px;height:46px;border-radius:15px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:0 0 auto}
  .pd-day b{font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
  .pd-day small{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .pd-info{flex:1;min-width:0}
  .pd-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pd-cat{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px}
  .pd-amt{font-weight:600;font-size:15px;color:var(--gasto);white-space:nowrap}
  .pd-total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px 16px;background:var(--gasto-soft);border-radius:18px;font-weight:700;color:var(--gasto)}
  .pd-total b{font-size:18px}
  .pend-row .go{color:var(--efeoro);opacity:.7;font-size:15px;margin-left:2px}

  /* Comprometido: clicable */
  .futuro-line{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .futuro-line .go{color:var(--efeoro);opacity:.65;font-size:15px}
  /* Detalle pendiente: fijo vs extra por fondo */
  .pd-row.box{border-top:0;border-radius:15px;margin-top:7px;padding:11px 12px}
  .pd-row.box:first-child{margin-top:0}
  .pd-fijo{background:#E7E0D2;border-left:5px solid #A8987E}
  .pd-anual{background:#EADBC0;border-left:5px solid #8A6D3B}
  .pd-extra{background:#EFD8C6;border-left:5px solid #BE855C}
  .fj-tot{display:flex;gap:10px;margin:2px 0 12px}
  .fj-tot>div{flex:1;background:var(--surface);border-radius:16px;padding:11px 14px;box-shadow:var(--shadow)}
  .fj-tot b{display:block;font-size:19px;font-weight:600;color:var(--ink)}
  .fj-tot small{font-size:11px;color:var(--muted)}
  .fj-tot .clic{cursor:pointer}
  .fj-tot .clic small{color:var(--efeoro);font-weight:600}
  .chip.fq-mes{background:#E7E0D2;color:#7A6B52}
  .chip.fq-ano{background:#E4D2AE;color:#7A5C22}
  .item.fx-ano{border-left:5px solid #8A6D3B}
  .item.fx-mes{border-left:5px solid #C9BEA8}
  .pd-legend{display:flex;gap:16px;margin:0 2px 12px;font-size:11.5px;color:var(--muted)}
  .pd-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
  /* Puntuales: pagado vs por pagar */
  .item.pagado{background:#E6E0D4;border:1px solid #D8CEBD;border-left:5px solid #B3A78F}
  .item.porpagar{background:#F2DDCB;border:1px solid #E3C4A9;border-left:5px solid #BE855C}
  .amt small.st{display:block;font-size:10px;font-weight:600;margin-top:2px}
  .item .pd-day{margin-right:2px}
  .amt small.stp{color:var(--gasto)} .amt small.stc{color:var(--muted)}
  /* Filtro de categoría */
  .cat-filter{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .filters{display:flex;gap:8px;margin-bottom:10px}
  .filters .cat-filter{margin-bottom:0;flex:1;min-width:0}
  .pmov{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
  .pmov input[type=checkbox]{width:20px;height:20px;margin-top:8px;flex:0 0 auto;accent-color:var(--moca)}
  .pmov-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .pmov-body input,.pmov-body select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#F4EFE7;border:1px solid var(--line);border-radius:12px;padding:9px 10px;outline:none}
  .pmov-row{display:flex;gap:6px}
  .pmov-row select{flex:1;min-width:0}
  .pmov-row input{width:104px;flex:0 0 auto}
  /* Detalle comprometido por mes */
  .fm-group{margin-top:14px}
  .fm-group:first-child{margin-top:4px}
  .fm-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:var(--ink);font-size:14px;margin-bottom:6px;text-transform:capitalize}
  .fm-head b{color:var(--gasto)}
  /* Ajustes */
  .aj-sep{height:1px;background:var(--line);margin:20px 0 14px}
  .aj-h{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
  .aj-btns{display:flex;gap:8px}
  .ok-note{font-size:12.5px;color:var(--ingreso);font-weight:600;margin-top:8px}
  .wipe-note{font-size:12.5px;color:var(--danger);font-weight:600;margin-top:8px}
</style>
</head>
<body>
  <div class="app-head">
    <div>
      <div class="hh-title">Hola, Juan</div>
      <div class="hh-sub">tu dinero, en calma</div>
    </div>
    <button class="gold-btn" onclick="openExtras()" aria-label="Apuntar gasto extra">+</button>
  </div>

  <div class="hero-num num" id="heroLibre">—</div>
  <div class="hero-cap" id="heroCap">libres tras los cobros de este mes</div>

  <div class="quick">
    <button class="q" onclick="openIngresos()"><span class="ic">€</span><span class="lb">Ingreso</span></button>
    <button class="q" onclick="openFijos()"><span class="ic">↻</span><span class="lb">Fijo</span></button>
    <button class="q" onclick="openExtras()"><span class="ic">+</span><span class="lb">Extra</span></button>
    <button class="q" onclick="openAjustes()"><span class="ic">⚙</span><span class="lb">Ajustes</span></button>
  </div>

  <div class="paneles">
    <div class="panel ing">
      <div class="p-title"><i class="dt dt-ing"></i>ING</div>
      <div class="p-big num" id="ingDisp">—</div>
      <div class="p-cap">disponible ahora</div>
      <div class="p-row"><span>Balance del mes</span><b class="num" id="ingBal">—</b></div>
      <div class="p-row"><span>Quedará</span><b class="num" id="ingQueda">—</b></div>
    </div>
    <div class="panel uni">
      <div class="p-title"><i class="dt dt-uni"></i>UNICAJA</div>
      <div class="p-big num" id="uniDisp">—</div>
      <div class="p-cap">disponible ahora</div>
      <div class="p-row"><span>Balance del mes</span><b class="num" id="uniBal">—</b></div>
      <div class="p-row"><span>Quedará</span><b class="num" id="uniQueda">—</b></div>
    </div>
    <div class="panel efe span2">
      <div class="p-title"><i class="dt dt-efe"></i>EFECTIVO</div>
      <div class="p-big num" id="efeDisp">—</div>
      <div class="p-cap">disponible ahora</div>
      <div class="p-row"><span>Balance del mes</span><b class="num" id="efeBal">—</b></div>
      <div class="p-row"><span>Quedará</span><b class="num" id="efeQueda">—</b></div>
    </div>
  </div>

  <div class="pend-block">
    <div class="pend-head">
      <span class="pn-title">Pendiente de cobro</span>
      <b class="pend-tot num" id="pendTotal">—</b>
      <span class="pn-ctrl">
        <button class="pn-btn" onclick="pendShift(-1)" aria-label="Mes anterior">‹</button>
        <b class="mes-lbl" id="pendMesLbl">este mes</b>
        <button class="pn-btn" onclick="pendShift(1)" aria-label="Mes siguiente">›</button>
      </span>
    </div>
    <div class="pend-row" onclick="openPendDetail('ing')"><span class="bk"><i class="dt dt-ing"></i>ING</span><span class="pc-cnt" id="ingPendN"></span><b class="num" id="ingPend">—</b><span class="go">›</span></div>
    <div class="pend-row" onclick="openPendDetail('unicaja')"><span class="bk"><i class="dt dt-uni"></i>UNICAJA</span><span class="pc-cnt" id="uniPendN"></span><b class="num" id="uniPend">—</b><span class="go">›</span></div>
    <div class="pend-row" onclick="openPendDetail('efectivo')"><span class="bk"><i class="dt dt-efe"></i>EFECTIVO</span><span class="pc-cnt" id="efePendN"></span><b class="num" id="efePend">—</b><span class="go">›</span></div>
  </div>
  <div class="futuro-line hidden" id="heroFuturo" onclick="openFuturoDetail()"></div>

<script>
const KEY='gastos:data';
// Dentro de Claude usa window.storage; abierta en local (descargada) usa el almacenamiento del navegador.
const store=(typeof window!=='undefined'&&window.storage)?window.storage:{
  get:async k=>{const v=localStorage.getItem(k);if(v===null)throw new Error('sin datos');return{key:k,value:v};},
  set:async(k,v)=>{localStorage.setItem(k,v);return{key:k,value:v};}
};
const CATS=['Vivienda','Suministros','Vehículo','Seguros','Autónomo / SS','Telefonía','Suscripciones','Alimentación','Ocio','El Mirador','Viajes','Regalos','Salud','Educación','Otros'];
const FREQS=[['mensual','al mes',1],['anual','al año',12]];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const isAnual=r=>r.freq==='anual';
const chMonth=r=>((Number(r.month)||1)-1);        // mes de cobro (0-11) del anual
const chargesIn=(r,mi)=>isAnual(r)?chMonth(r)===mi:true;  // ¿se cobra en el mes mi?
const chargeAmt=r=>Number(r.amount)||0;           // importe completo cuando se cobra

// Semilla con los gastos reales de Juan. Los ids fijos evitan duplicados al reabrir.
const SEED={recurrentes:[
  {id:'r_spotify',   name:'Spotify',            amount:21, freq:'mensual', category:'Suscripciones', pay:'ing', day:1},
  {id:'r_hbo',       name:'HBO',                amount:11, freq:'mensual', category:'Suscripciones', pay:'ing', day:1},
  {id:'r_appletv',   name:'Apple TV',           amount:10, freq:'mensual', category:'Suscripciones', pay:'ing', day:1},
  {id:'r_applestor', name:'Almacenamiento Apple',amount:3, freq:'mensual', category:'Suscripciones', pay:'ing', day:1},
  {id:'r_pepephone', name:'Pepephone',          amount:23, freq:'mensual', category:'Telefonía', pay:'ing', day:1},
  {id:'r_padel',     name:'El Mirador pádel',   amount:57, freq:'mensual', category:'Ocio', pay:'ing', day:1},
  {id:'r_youtube',   name:'YouTube',            amount:14, freq:'mensual', category:'Suscripciones', pay:'ing', day:1},
  {id:'r_gdrive',    name:'Google Drive',       amount:10, freq:'mensual', category:'Suscripciones', pay:'ing', day:1},
  {id:'r_casa800',   name:'Casa · aportación',  amount:800,freq:'mensual', category:'Vivienda', pay:'ing', day:1},
  {id:'r_casa400',   name:'Casa · aportación extra', amount:400,freq:'mensual', category:'Vivienda', pay:'efectivo', day:1}
],extras:[],ingresos:[]};

let data={recurrentes:[],extras:[],ingresos:[],caja:[],saldos:null};
let tab='ingresos';
let editing=null; // {type,id}
const PAYS=[['ing','ING'],['unicaja','Unicaja'],['efectivo','Efectivo']];
const payLabel=p=>p==='efectivo'?'Efectivo':p==='unicaja'?'Unicaja':'ING';
const payChip=p=>'<span class="chip '+(p==='efectivo'?'ex':p==='unicaja'?'bk-uni':'bk-ing')+'">'+payLabel(p)+'</span>';

const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const monthEq=r=>{const f=FREQS.find(x=>x[0]===r.freq)||FREQS[0];return (Number(r.amount)||0)/f[2];};
const ivaOf=i=>(Number(i.base)||0)*(Number(i.ivaPct)||0)/100;
const retOf=i=>(Number(i.base)||0)*(Number(i.retPct)||0)/100;
const netoOf=i=>(Number(i.base)||0)-retOf(i);           // lo realmente disponible
const cobradoOf=i=>(Number(i.base)||0)+ivaOf(i)-retOf(i); // lo que entra en cuenta

async function load(){
  try{
    const res=await store.get(KEY);
    data=JSON.parse(res.value);
    if(!data.recurrentes)data.recurrentes=[];
    if(!data.extras)data.extras=[];
    if(!data.ingresos)data.ingresos=[];
    if(!data.caja)data.caja=[];
    if(data.saldos===undefined)data.saldos=null;
  }catch(e){
    data={recurrentes:[],extras:[],ingresos:[],caja:[],saldos:null};
  }
  // Compatibilidad: todo lo antiguo sin método de pago se asume "cuenta".
  [...data.recurrentes,...data.extras,...data.ingresos].forEach(x=>{if(!x.pay||x.pay==='cuenta')x.pay='ing';});
  data.recurrentes.forEach(r=>{if(!r.day)r.day=1;});
  if(data.saldos&&data.saldos.ing===undefined){
    data.saldos={ing:Number(data.saldos.cuenta)||0,unicaja:0,efectivo:Number(data.saldos.efectivo)||0,desde:data.saldos.desde};
    await save();
  }
  // Corrección 09/08/2026: la nómina se apunta a mano cada mes; se retira la autocargada.
  if(data.ingresos.some(i=>i.id==='i_nom_202608')){data.ingresos=data.ingresos.filter(i=>i.id!=='i_nom_202608');await save();}
  // Fusiona la semilla: añade lo que aún no esté (por id), sin tocar lo demás.
  let changed=false;
  SEED.recurrentes.forEach(s=>{
    if(!data.recurrentes.some(r=>r.id===s.id)){data.recurrentes.push({...s});changed=true;}
  });
  (SEED.ingresos||[]).forEach(s=>{
    if(!data.ingresos.some(i=>i.id===s.id)){data.ingresos.push({...s});changed=true;}
  });
  if(changed)await save();
  render();
}
async function save(){
  try{await store.set(KEY,JSON.stringify(data));}
  catch(e){console.error('No se pudo guardar',e);}
}

const cap=s=>s[0].toUpperCase()+s.slice(1);

const shell=(addCls,addTxt,type)=>`<div id="mList"></div><div id="mSlot"></div><button class="add ${addCls}" id="mAdd" onclick="openForm('${type}')">${addTxt}</button>`;

function fillIngresos(){

}

/* Fijos: lista + añadir (doble función) */
let fijoFilter='todos';
function openFijos(){currentModal='fijos';fijoFilter='todos';openModal('Gastos fijos',

         <option value="todos"${fijoFilter==='todos'?' selected':''}>Todos</option>

  }

  let lista=fijoFilter==='mensual'?men:fijoFilter==='anual'?anu:data.recurrentes;

  if(!lista.length){L.innerHTML='<div class="empty"><b>Nada aquí</b>No hay fijos de ese tipo.</div>';return;}

      <div class="body"><div class="name">${esc(r.name)}</div>
      <div class="meta"><span class="chip">${esc(r.category||'Otros')}</span>${payChip(r.pay)}<span class="chip ${an?'fq-ano':'fq-mes'}">${an?'Anual':'Mensual'}</span></div></div>
      <div class="amt num gasto">${eur(r.amount)}<small>${cuando}</small></div>

  });
}
function openAnuales(){
  const anu=[...data.recurrentes.filter(isAnual)].sort((a,b)=>(chMonth(a)-chMonth(b))||((a.day||1)-(b.day||1)));

  }
  html+=anu.map(r=>`<div class="pd-row box pd-anual">
      <div class="pd-day"><b>${r.day||1}</b><small>${MESES[chMonth(r)].slice(0,3)}</small></div>
      <div class="pd-info"><div class="pd-name">${esc(r.name)}</div><div class="pd-cat">${esc(r.category||'Otros')} · ${payLabel(r.pay)} · ${MESES[chMonth(r)]}</div></div>
      <div class="pd-amt">${eur(r.amount)}</div>

  html+='<div class="pd-total"><span>Total al año</span><b>'+eur(tot)+'</b></div>';

}

/* Extras: navegador de mes + lista + añadir */
let exCat='__all',exPay='__all';
function openExtras(){currentModal='extras';exCat='__all';exPay='__all';openModal('Gastos puntuales',
  `<div class="ex-head" style="margin:2px 0 12px">

   <div class="filters">
     <select class="cat-filter" id="exFilter" onchange="exCat=this.value;fillExtras()">

     <select class="cat-filter" id="exPayFilter" onchange="exPay=this.value;fillExtras()">
       <option value="__all">Todas las cuentas</option>
       <option value="ing">ING</option>
       <option value="unicaja">Unicaja</option>
       <option value="efectivo">Efectivo</option>

   </div>`+shell('ex','+ Apuntar gasto extra','extra')+'<button class="add" id="mPaste" onclick="openPaste()" style="margin-top:8px">📋 Pegar movimientos del banco</button>');

function fillExtras(){

  const todayStr=isoD(now);
  const exTgt=new Date(y,m+exOffset,1),exY=exTgt.getFullYear(),exM=exTgt.getMonth();

    L.innerHTML='<div class="empty"><b>Sin gastos extra en '+donde+'</b>'+(exCat==='__all'?'Usa las flechas para ver otros meses, o apunta aquí un gasto puntual.':'Prueba otra categoría o cambia de mes.')+'</div>';return;

      <div class="amt num gasto">${eur(e.amount)}<small class="st ${pagado?'stc':'stp'}">${pagado?'pagado':'pendiente'}</small></div>
      <div class="row-actions"><button class="icon-btn" onclick="edit('extra','${e.id}')" aria-label="Editar">✎</button>${delBtn('extra',e.id)}</div>`;

/* Detalle de lo pendiente de una caja en el mes seleccionado */
function pendItems(pay){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const hoyDia=now.getDate(),todayStr=isoD(now);
  const tgt=new Date(y,m+pendOffset,1),ty=tgt.getFullYear(),tm=tgt.getMonth();
  const eom=new Date(ty,tm+1,0).getDate();
  const inTgt=d=>{const x=new Date(d);return x.getFullYear()===ty&&x.getMonth()===tm;};
  const items=[];
  data.recurrentes.filter(r=>(r.pay||'ing')===pay&&chargesIn(r,tm)).forEach(r=>{
    const dia=Math.min(Number(r.day)||1,eom);
    if(pendOffset===0?dia>hoyDia:true)items.push({dia,concepto:r.name,cat:r.category||'Otros',importe:chargeAmt(r),tipo:isAnual(r)?'Anual':'Fijo'});
  });
  data.extras.filter(e=>(e.pay||'ing')===pay&&inTgt(e.date)).forEach(e=>{
    if(pendOffset===0?e.date>todayStr:true){const dia=new Date(e.date+'T00:00:00').getDate();items.push({dia,concepto:e.name,cat:e.category||'Otros',importe:Number(e.amount)||0,tipo:'Extra'});}
  });
  return items.sort((a,b)=>a.dia-b.dia);
}
function openPendDetail(pay){
  const now=new Date();
  const items=pendItems(pay);
  const total=items.reduce((s,x)=>s+x.importe,0);
  const cajaLbl=pay==='efectivo'?'Efectivo':pay==='unicaja'?'Unicaja':'ING';
  const cuando=pendOffset===0?'este mes':mesLbl(pendOffset,now);
  let html='<div class="m-sub">Lo que te queda por pagar en '+cuando+' desde '+cajaLbl+'</div>';
  if(!items.length){
    html+='<div class="empty"><b>Nada pendiente</b>No queda ningún cobro por salir de '+cajaLbl+' en '+cuando+'.</div>';
  }else{
    html+='<div class="pd-legend"><span><i style="background:#A8987E"></i>Fijo mensual</span><span><i style="background:#8A6D3B"></i>Fijo anual</span><span><i style="background:#BE855C"></i>Puntual</span></div>';
    html+=items.map(x=>`<div class="pd-row box ${x.tipo==='Anual'?'pd-anual':x.tipo==='Fijo'?'pd-fijo':'pd-extra'}">
        <div class="pd-day"><b>${x.dia}</b><small>día</small></div>
        <div class="pd-info"><div class="pd-name">${esc(x.concepto)}</div><div class="pd-cat">${esc(x.cat)} · ${x.tipo}</div></div>
        <div class="pd-amt">${eur(x.importe)}</div>
      </div>`).join('');
    html+='<div class="pd-total"><span>Total pendiente</span><b>'+eur(total)+'</b></div>';
  }
  openModal('Pendiente · '+cajaLbl,html);
}
/* Cambio 3: comprometido futuro agrupado por mes */
function openFuturoDetail(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const finMes=isoD(new Date(y,m+1,0));
  const futuros=data.extras.filter(e=>e.date>finMes);
  const total=futuros.reduce((s,e)=>s+(Number(e.amount)||0),0);
  let html='<div class="m-sub">Gastos puntuales ya apuntados con fecha de meses siguientes. Aún no descuentan, pero conviene tenerlos presentes.</div>';
  if(!futuros.length){
    html+='<div class="empty"><b>Nada comprometido</b>No tienes gastos puntuales apuntados para meses futuros.</div>';
    openModal('Comprometido a futuro',html);return;
  }
  const groups={};
  futuros.forEach(e=>{const d=new Date(e.date+'T00:00:00');const k=d.getFullYear()*12+d.getMonth();(groups[k]=groups[k]||[]).push(e);});
  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach(k=>{
    const arr=groups[k].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const suma=arr.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const d=new Date(Math.floor(k/12),k%12,1);
    const titulo=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
    html+='<div class="fm-group"><div class="fm-head"><span>'+titulo+'</span><b>'+eur(suma)+'</b></div>';
    html+=arr.map(e=>`<div class="pd-row box pd-extra">
        <div class="pd-day"><b>${new Date(e.date+'T00:00:00').getDate()}</b><small>día</small></div>
        <div class="pd-info"><div class="pd-name">${esc(e.name)}</div><div class="pd-cat">${esc(e.category||'Otros')} · ${payLabel(e.pay)}</div></div>
        <div class="pd-amt">${eur(e.amount)}</div>
      </div>`).join('');
    html+='</div>';
  });
  html+='<div class="pd-total"><span>Total comprometido</span><b>'+eur(total)+'</b></div>';
  openModal('Comprometido a futuro',html);
}

function render(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const isoLocal=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const inMonth=d=>{const x=new Date(d);return x.getFullYear()===y&&x.getMonth()===m;};
  const todayStr=isoLocal(now);
  const hoyDia=now.getDate();
  const eomDia=new Date(y,m+1,0).getDate();
  const diaDe=r=>Math.min(Number(r.day)||1,eomDia);

  const ingAno=data.ingresos.filter(i=>new Date(i.date).getFullYear()===y).reduce((s,i)=>s+netoOf(i),0);

  const calc=p=>{
    const fijos=data.recurrentes.filter(r=>(r.pay||'ing')===p);
    const exs=data.extras.filter(e=>(e.pay||'ing')===p&&inMonth(e.date));
    const ing=data.ingresos.filter(i=>(i.pay||'ing')===p&&inMonth(i.date)).reduce((s,i)=>s+netoOf(i),0);
    const fijosMes=fijos.filter(r=>chargesIn(r,m));
    const fijoMes=fijosMes.reduce((s,r)=>s+chargeAmt(r),0);
    const exMes=exs.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const pendF=fijosMes.filter(r=>diaDe(r)>hoyDia);
    const pendE=exs.filter(e=>e.date>todayStr);
    const pend=pendF.reduce((s,r)=>s+chargeAmt(r),0)+pendE.reduce((s,e)=>s+(Number(e.amount)||0),0);
    return {ing,fijoMes,exMes,pend,pendN:pendF.length+pendE.length,bal:ing-fijoMes-exMes};
  };
  const M={ing:calc('ing'),unicaja:calc('unicaja'),efectivo:calc('efectivo')};
  const fijoMes=M.ing.fijoMes+M.unicaja.fijoMes+M.efectivo.fijoMes;

  const PRE={ing:'ing',unicaja:'uni',efectivo:'efe'};
  const fmtBal=n=>(n>=0?'+':'\u2212')+eur(Math.abs(n));
  const setBal=(id,v)=>{const el=document.getElementById(id);el.textContent=fmtBal(v);el.className='num '+(v>=0?'pos':'neg');};
  const setQ=(id,v)=>{const el=document.getElementById(id);el.textContent=eur(v);el.className='num '+(v<0?'neg':'');};
  // Pendiente del mes seleccionado (0 = actual: solo lo que queda; futuros: mes completo)
  const tgt=new Date(y,m+pendOffset,1);
  const ty=tgt.getFullYear(),tm=tgt.getMonth();
  const inTgt=d=>{const x=new Date(d);return x.getFullYear()===ty&&x.getMonth()===tm;};
  const pendDe=p=>{
    const fijos=data.recurrentes.filter(r=>(r.pay||'ing')===p&&chargesIn(r,tm));
    const exs=data.extras.filter(e=>(e.pay||'ing')===p&&inTgt(e.date));
    const pf=pendOffset===0?fijos.filter(r=>diaDe(r)>hoyDia):fijos;
    const pe=pendOffset===0?exs.filter(e=>e.date>todayStr):exs;
    return {v:pf.reduce((s,r)=>s+chargeAmt(r),0)+pe.reduce((s,e)=>s+(Number(e.amount)||0),0),n:pf.length+pe.length};
  };
  document.getElementById('pendMesLbl').textContent=mesLbl(pendOffset,now);
  let pTot=0;
  Object.keys(M).forEach(p=>{
    setBal(PRE[p]+'Bal',M[p].bal);
    const pd=pendDe(p);
    pTot+=pd.v;
    document.getElementById(PRE[p]+'Pend').textContent=eur(pd.v);
    document.getElementById(PRE[p]+'PendN').textContent=pd.n+(pd.n===1?' gasto':' gastos');
  });
  document.getElementById('pendTotal').textContent=eur(pTot);

  // Disponible acumulado: cada fijo se descuenta en su d\u00eda de cobro de cada mes
  if(data.saldos){
    const desde=data.saldos.desde;
    const upTo=x=>x.date>=desde&&x.date<=todayStr;
    const cargosFijo=p=>{
      let s=0;
      data.recurrentes.filter(r=>(r.pay||'ing')===p).forEach(r=>{
        const d0=new Date(desde+'T00:00:00');
        let mm=new Date(d0.getFullYear(),d0.getMonth(),1);
        while(mm<=now){
          if(chargesIn(r,mm.getMonth())){
            const eom=new Date(mm.getFullYear(),mm.getMonth()+1,0).getDate();
            const fs=isoLocal(new Date(mm.getFullYear(),mm.getMonth(),Math.min(Number(r.day)||1,eom)));
            if(fs>=desde&&fs<=todayStr)s+=chargeAmt(r);
          }
          mm=new Date(mm.getFullYear(),mm.getMonth()+1,1);
        }
      });
      return s;
    };
    const flow=p=>({
      ing:data.ingresos.filter(i=>(i.pay||'ing')===p&&upTo(i)).reduce((s,i)=>s+netoOf(i),0),
      ex:data.extras.filter(e=>(e.pay||'ing')===p&&upTo(e)).reduce((s,e)=>s+(Number(e.amount)||0),0)
    });
    let libreT=0;
    Object.keys(M).forEach(p=>{
      const f=flow(p);
      const disp=(Number(data.saldos[p])||0)+f.ing-f.ex-cargosFijo(p);
      document.getElementById(PRE[p]+'Disp').textContent=eur(disp);
      const queda=disp-M[p].pend;
      setQ(PRE[p]+'Queda',queda);
      libreT+=queda;
    });
    document.getElementById('heroLibre').textContent=eur(libreT);
    document.getElementById('heroCap').textContent='libres tras los cobros de este mes';
  }else{
    ['ingDisp','uniDisp','efeDisp','ingQueda','uniQueda','efeQueda'].forEach(id=>document.getElementById(id).textContent='\u2014');
    document.getElementById('heroLibre').textContent='\u2014';
    document.getElementById('heroCap').textContent='fija tus saldos para ver cu\u00e1nto te queda libre';
  }

  // Gastos ya apuntados para meses siguientes (no restan a\u00fan, pero se avisan)
  const finMes=isoLocal(new Date(y,m+1,0));
  const futuro=data.extras.filter(e=>e.date>finMes).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const hf=document.getElementById('heroFuturo');
  if(futuro>0){hf.classList.remove('hidden');hf.innerHTML='<span>Comprometido para pr\u00f3ximos meses: '+eur(futuro)+'</span><span class="go">\u203a</span>';}
  else hf.classList.add('hidden');

}

/* ---------- Pegar movimientos del banco ---------- */
let pasted=[];
function tISO(d){const p=d.split('/');return p[2]+'-'+p[1]+'-'+p[0];}
function titleCase(s){return s.toLowerCase().replace(/\s+/g,' ').trim().replace(/\b([a-záéíóúñ])/g,c=>c.toUpperCase());}
function cleanTail(s){return s.replace(/\.{2,}/g,'').replace(/\s{2,}/g,' ').trim().replace(/\s+(es|es\.?)$/i,'').trim();}
function guessCat(low){
  if(/el mirador|p[áa]del/.test(low))return 'El Mirador';
  if(/cafeter|restaurant|\bbar\b|helader|cervec|tapas|pizzer|burger|kebab/.test(low))return 'Ocio';
  if(/bizum/.test(low))return 'Otros';
  if(/gasolin|combustible|carburante|repsol|cepsa|galp|\bbp\b|shell|petro/.test(low))return 'Vehículo';
  if(/supermercad|mercadona|carrefour|lidl|aldi|\bdia\b|consum|alcampo|hipercor|eroski/.test(low))return 'Alimentación';
  if(/farmacia|cl[íi]nica|hospital|m[ée]dic|dental|dentista/.test(low))return 'Salud';
  if(/iberia|vueling|ryanair|renfe|hotel|booking|airbnb|billete/.test(low))return 'Viajes';
  return 'Otros';
}
// Parser de importe que entiende 1,084.02 (US) y 1.084,02 € (EU)
function parseAmt(raw){
  const neg=/-/.test(raw);
  let s=raw.replace(/[^\d.,]/g,'');
  if(!/\d/.test(s))return null;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>ld)s=s.replace(/\./g,'').replace(',','.');
  else if(ld>lc)s=s.replace(/,/g,'');
  else s=s.replace(/[.,]/g,'');
  const v=parseFloat(s);if(isNaN(v))return null;
  return neg?-v:v;
}
function makeMov(desc,amount,date){
  desc=desc.replace(/\s+/g,' ').trim();
  const low=desc.toLowerCase();
  const cat=guessCat(low);
  let name='',m;
  if(/bizum/.test(low)){
    m=desc.match(/bizum\s+(?:enviado|recibido)\s+a\s+(.+)$/i);
    let who=(m?m[1]:'').replace(/\b(sin\s+concepto|gasto\s+bizum|concepto)\b.*$/i,'').replace(/\.{2,}/g,'').trim();
    name=who?('Bizum a '+titleCase(who)):'Bizum';
  }else if((m=desc.match(/pago en\s+(.+)$/i))){
    let who=m[1].replace(/\bcafeter[íi]as?\s+y\s+restaurantes\b.*$/i,'').replace(/\bsin\s+concepto\b.*$/i,'');
    name=titleCase(cleanTail(who))||'Pago';
  }else{
    let d=desc.replace(/cafeter[íi]as?\s+[yуi]\s+restaurantes/ig,'').replace(/otros gastos|ocio y viajes|gasto bizum|sin concepto|compras|transferencia/ig,'').trim();
    name=titleCase(cleanTail(d))||'Gasto';
  }
  return {date:date||null,name,cat,amount:Math.abs(amount)};
}
// Formato tabla (copiado de la web): fecha … -importe saldo, todo en una línea
function parseTabular(text){
  const t=text.replace(/[\r\n]+/g,' ').replace(/\s{2,}/g,' ').trim();
  const re=/(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+(-?\d[\d.,]*)\s+(\d[\d.,]*)(?=\s+\d{2}\/\d{2}\/\d{4}|\s*$)/g;
  const out=[];let m;
  while((m=re.exec(t))){
    const amt=parseAmt(m[3]);
    if(amt==null||amt>=0)continue;
    out.push(makeMov(m[2],amt,tISO(m[1])));
  }
  return out;
}
// Formato vertical (copiado de la app): cada campo en su línea, sin fecha
function parseVertical(text){
  const lines=text.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean);
  const isAmt=s=>/^-?\s*[\d.,]+\s*€?$/.test(s)&&/\d/.test(s);
  const out=[];let buf=[];
  for(const ln of lines){
    if(isAmt(ln)){
      const v=parseAmt(ln);
      if(v!=null&&v<0){out.push(makeMov(buf.join(' '),v,null));buf=[];}
      else buf=[];               // saldo o positivo → descartar buffer
    }else buf.push(ln);
  }
  return out;
}
function parseMovs(text){
  const tab=parseTabular(text);
  return tab.length?tab:parseVertical(text);
}

  const box=document.getElementById('pasteResult');

  const tot=pasted.reduce((s,r)=>s+r.amount,0);
  let h='<div class="m-sub" style="margin-top:14px">'+pasted.length+' gastos detectados · '+eur(tot)+'. Revisa, desmarca los que no quieras y confirma.</div>';
  h+=pasted.map((r,i)=>`<div class="pmov">

}
async function savePasted(){

    const name=(document.getElementById('p_name_'+i).value||'').trim();
    const amt=parseFloat(document.getElementById('p_amt_'+i).value);

    <div class="field"><label>Efectivo (€)</label><input id="s_cash" type="number" inputmode="decimal" step="0.01" placeholder="0,00" value="${s.efectivo??''}"></div>
    <div class="field"><label>Fecha del saldo</label><input id="s_desde" type="date" value="${s.desde||today}"></div>
    <div class="tot-note">Pon lo que tienes hoy en el banco y en la cartera. A partir de esa fecha, la app suma ingresos y resta gastos. Lo apuntado con fecha futura no descuenta hasta que llegue el día.</div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal()">Cerrar</button>
      <button class="btn primary" onclick="saveSaldos()">Guardar saldos</button>
    </div>

    <div class="aj-sep"></div>
    <div class="aj-h">Copia de seguridad</div>
    <div class="aj-btns">
      <button class="btn primary" onclick="hacerCopia()">Hacer copia</button>
      <button class="btn" onclick="abrirRecuperar()">Recuperar copia</button>
    </div>
    <div id="bkSlot"></div>

    <div class="aj-sep"></div>
    <div class="aj-h">Zona peligrosa</div>
    <button class="btn" id="wipeBtn" onclick="borrarTodo()" style="width:100%;color:var(--danger)">Borrar todos los datos</button>
  </div>`);
}
async function saveSaldos(){
  const i=parseFloat(val('s_ing')),u=parseFloat(val('s_uni')),c=parseFloat(val('s_cash'));
  if(isNaN(i)&&isNaN(u)&&isNaN(c)){formErr('Pon al menos uno de los saldos.');return;}
  data.saldos={ing:isNaN(i)?0:i,unicaja:isNaN(u)?0:u,efectivo:isNaN(c)?0:c,desde:val('s_desde')};
  await save();closeModal();render();
}
async function hacerCopia(){
  const txt=JSON.stringify(data);
  const slot=document.getElementById('bkSlot');if(!slot)return;
  try{
    await navigator.clipboard.writeText(txt);
    slot.innerHTML='<div class="ok-note">Copiado ✓ &nbsp;Pégalo en tus notas o email para guardarlo.</div>';
  }catch(e){
    slot.innerHTML='<div class="field" style="margin-top:12px"><label>No pude copiar solo. Copia este texto a mano y guárdalo:</label><textarea id="bk" rows="5">'+esc(txt)+'</textarea></div>';
    const ta=document.getElementById('bk');if(ta){ta.focus();ta.select();}
  }
}
function abrirRecuperar(){
  const slot=document.getElementById('bkSlot');if(!slot)return;
  slot.innerHTML='<div class="field" style="margin-top:12px"><label>Pega aquí una copia guardada y pulsa Restaurar:</label><textarea id="bk" rows="5" placeholder="Pega el texto de tu copia…"></textarea></div><div class="aj-btns"><button class="btn primary" onclick="loadBackup()">Restaurar</button></div>';
  const ta=document.getElementById('bk');if(ta)ta.focus();
}
function val(id){return document.getElementById(id).value.trim();}
function formErr(msg){
  const f=document.querySelector('.form');if(!f)return;
  let e=f.querySelector('.form-err');
  if(!e){e=document.createElement('div');e.className='form-err';f.prepend(e);}
  e.textContent=msg;
}
function arrFor(type){return type==='fijo'?data.recurrentes:type==='extra'?data.extras:data.ingresos;}
function edit(type,id){
  const item=arrFor(type).find(x=>x.id===id);
  if(item)openForm(type,item);
}
let pendOffset=0; // 0 = mes actual; 1 = mes siguiente...
function pendShift(d){pendOffset=Math.max(0,Math.min(11,pendOffset+d));render();}
let exOffset=0; // mes visible en la lista de extras
function exShift(d){exOffset=Math.max(-24,Math.min(12,exOffset+d));fillExtras();}
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mesLbl=(off,base)=>{if(off===0)return 'este mes';const t=new Date(base.getFullYear(),base.getMonth()+off,1);return t.toLocaleDateString('es-ES',{month:'long'})+(t.getFullYear()!==base.getFullYear()?' '+t.getFullYear():'');};
let pendingDel=null,pendingTimer=null;
function delBtn(type,id){
  const on=pendingDel===type+':'+id;
  return `<button class="icon-btn del ${on?'confirm':''}" onclick="del('${type}','${id}')" aria-label="Eliminar">${on?'¿Sí?':'🗑'}</button>`;
}
async function del(type,id){
  const key=type+':'+id;
  if(pendingDel!==key){
    pendingDel=key;clearTimeout(pendingTimer);
    pendingTimer=setTimeout(()=>{pendingDel=null;refreshModal();},4000);
    refreshModal();return;
  }
  pendingDel=null;clearTimeout(pendingTimer);
  if(type==='fijo')data.recurrentes=data.recurrentes.filter(x=>x.id!==id);
  else if(type==='extra')data.extras=data.extras.filter(x=>x.id!==id);
  else data.ingresos=data.ingresos.filter(x=>x.id!==id);
  await save();refreshModal();render();
}
async function borrarTodo(){
  const btn=document.getElementById('wipeBtn');if(!btn)return;
  if(pendingDel!=='wipe'){
    pendingDel='wipe';clearTimeout(pendingTimer);
    btn.textContent='¿Seguro? Toca otra vez para borrarlo todo';
    pendingTimer=setTimeout(()=>{pendingDel=null;const b=document.getElementById('wipeBtn');if(b)b.textContent='Borrar todos los datos';},4000);
    return;
  }
  pendingDel=null;clearTimeout(pendingTimer);
  data={recurrentes:[],extras:[],ingresos:[],caja:[],saldos:null};
  await save();closeModal();render();
}
async function loadBackup(){
  const slot=document.getElementById('bkSlot');
  try{
    const d=JSON.parse(document.getElementById('bk').value);
    if(!d||typeof d!=='object'||Array.isArray(d))throw 0;
    data={recurrentes:d.recurrentes||[],extras:d.extras||[],ingresos:d.ingresos||[],caja:d.caja||[],saldos:d.saldos||null};
    await save();closeModal();render();
  }catch(e){if(slot)slot.innerHTML='<div class="wipe-note">Ese texto no es una copia válida.</div>';}
}

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
load();
</script>

<div class="modal-bg hidden" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal" id="modalCard">
    <div class="modal-grip"></div>
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="modal-x" onclick="closeModal()" aria-label="Cerrar">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>
</body>
</html>
